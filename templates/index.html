<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Manager V4</title><link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
<header class="topbar"><div><div class="eyebrow">FFMPEG CONTROL PANEL</div><h1>Stream Manager <span>V4</span></h1></div><button class="btn primary" onclick="openChannelModal()">＋ قناة جديدة</button></header>
<section class="stats">
<div class="stat"><span>القنوات</span><b id="statChannels">0</b></div><div class="stat"><span>تعمل</span><b id="statRunning">0</b></div>
<div class="stat"><span>كل المخارج</span><b id="statOutputs">0</b></div><div class="stat"><span>مخارج تعمل</span><b id="statRunningOutputs">0</b></div>
<div class="stat perf"><span>CPU</span><b id="perfCpu">0%</b></div><div class="stat perf"><span>RAM</span><b id="perfRam">0%</b></div>
<div class="stat perf"><span>FFmpeg CPU</span><b id="perfFfmpeg">0%</b></div><div class="stat perf"><span>FFmpeg Processes</span><b id="perfProc">0</b></div>
</section>
<main><div class="section-head"><div><h2>القنوات</h2><p>مصادر، Outputs، مفاتيح متعددة، جودة ومعالجة مباشرة.</p></div><button class="btn ghost" onclick="loadAll(true)">↻ تحديث</button></div><div id="channels" class="channels"></div></main>
<section class="logs-panel"><div class="section-head"><div><h2>سجل النظام</h2><p>الأخطاء والاتصالات المهمة فقط لتقليل ضغط قاعدة البيانات.</p></div></div><pre id="logs">لا توجد سجلات.</pre></section>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">قناة جديدة</h2><button class="icon" onclick="closeModal()">×</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toast" class="toast"></div>
<script src="/static/script.js"></script>
</body>
</html>
